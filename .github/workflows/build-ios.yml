name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Create IPA
        run: |
          rm -rf Payload Aujunpeak-VN.ipa
          mkdir -p Payload
          cp -R "build/3105.app" "Payload/@huanhavn.app"
          zip -qry Aujunpeak-VN.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Aujunpeak-VN-IPA
          path: Aujunpeak-VN.ipa
